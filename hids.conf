# ==============================================================================
# hids.conf — HIDS configuration
# Sourced by libs/common.sh. Any value set here overrides the script default.
# Team rule: NO threshold and NO whitelist is ever hard-coded in a module.
# ==============================================================================

# --- Paths (fall back to ./logs and ./state if not run as root) ---
LOG_DIR="/var/log/hids"
STATE_DIR="/var/lib/hids"

# --- Module 1: system health ---
CPU_LOAD_WARN=1.0
CPU_LOAD_CRIT=2.0
MEM_USED_WARN=80
MEM_USED_CRIT=92
DISK_USED_WARN=80
DISK_USED_CRIT=90

# --- Module 2: users ---
FAILED_LOGIN_WARN=20
FAILED_LOGIN_CRIT=50
AUTH_LOG="/var/log/auth.log"
PASSWD_FILE="/etc/passwd"
SHADOW_FILE="/etc/shadow"
WORK_HOURS_START=7
WORK_HOURS_END=20
LOW_UID_THRESHOLD=1000

# --- Module 3: processes and network ---
# Expected listening ports. Any listening port not in this list raises an alert.
PORT_WHITELIST="22 53 80 443 631"
PROCESS_WHITELIST="rsync tar gzip apt dpkg unattended-upgrade"
CPU_PROCESS_ALERT=80
MEM_PROCESS_ALERT=50

# --- Module 4: file integrity ---
WATCHED_FILES="/etc/passwd /etc/shadow /etc/group /etc/sudoers /etc/ssh/sshd_config /etc/crontab /etc/hosts /root/.bashrc /root/.profile /root/.ssh/authorized_keys"
SENSITIVE_FILE_MODES="/etc/shadow:640 /etc/gshadow:640 /etc/passwd:644 /etc/group:644 /etc/sudoers:440 /etc/ssh/sshd_config:600"
FIND_EXCLUDE="/proc /sys /dev /run /snap /var/lib/docker"
SUID_WHITELIST="/usr/bin/sudo /usr/bin/passwd /usr/bin/su /usr/bin/mount /usr/bin/umount /usr/bin/chsh /usr/bin/chfn /usr/bin/gpasswd /usr/bin/newgrp /usr/bin/pkexec /usr/bin/fusermount3 /usr/lib/openssh/ssh-keysign"

# --- Module 5: alerting ---
ALERT_COOLDOWN=3600
ALERT_EMAIL=""
ALERT_EMAIL_MIN_SEVERITY="CRITICAL"

# Runtime hardening and optional integrations
LOCK_FILE="/run/hids.lock"
SYSLOG_IDENTIFIER="hids"
SYSLOG_ENABLED=0
SYSLOG_SERVER=""
SYSLOG_PORT=514
SYSTEMD_SERVICE_EXCLUDE="user@*.service user-runtime-dir@*.service"
LOG_RETENTION_DAYS=30